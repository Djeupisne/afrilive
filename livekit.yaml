# Configuration LiveKit (dev local). Cf. https://livekit.io/docs
port: 7880
bind_addresses:
  - ""
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: false
keys:
  devkey: secretsecretsecretsecretsecret32
logging:
  level: info
room:
  empty_timeout: 300          # ferme la room 5 min après le départ du dernier participant
  max_participants: 1000
webhook: []                   # à remplir en prod : url + api_key du backend
